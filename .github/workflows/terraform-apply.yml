name: Terraform Development Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-development-state
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: terraform-development

    defaults:
      run:
        working-directory: environments/development

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_APPLY_SA }}
          create_credentials_file: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false

      - name: Initialize
        run: terraform init -input=false -lockfile=readonly

      - name: Validate
        run: terraform fmt -check && terraform validate -no-color

      - name: Generate saved plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Show plan
        run: terraform show -no-color tfplan

      - name: Permit only VM in-place update
        run: |
          terraform show -json tfplan > plan.json
          jq -e '
            all(.resource_changes[]?;
              .change.actions == ["no-op"] or
              (.address == "google_compute_instance.web" and
               .change.actions == ["update"])
            )
          ' plan.json

      - name: Apply saved plan
        run: terraform apply -input=false tfplan
